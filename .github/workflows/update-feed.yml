name: Update Feed

on:
  schedule:
    - cron: '15 */4 * * *' # Every 4 hours
  workflow_dispatch: # Manual trigger
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Force Node.js 24 for transitive JS actions (e.g. upload-artifact called by
# upload-pages-artifact@v4) that still pin Node 20. Node 20 will be removed
# from runners on 2026-09-16.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Generate feed
        run: python generate_feed.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Keep this scheduled workflow from being auto-disabled after 60 days of
  # repository inactivity. On every scheduled run we re-enable the workflow via
  # GitHub's own API, which resets the inactivity countdown — no dummy commits
  # and no Personal Access Token required. (Same idea as the
  # liskin/gh-workflow-keepalive action, inlined to avoid a third-party
  # dependency.) Runs independently of the feed job, so it still fires even when
  # feed generation fails.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow to dodge the 60-day inactivity auto-disable
        env:
          GH_TOKEN: ${{ github.token }}
        # Hit the enable REST endpoint addressed by FILENAME. The previous
        # `gh workflow enable "${{ github.workflow }}"` passed the display name
        # ("Update Feed"), which the runner's gh failed to resolve ("could not
        # find any workflows named Update Feed"). The endpoint accepts the
        # workflow filename directly, skipping name resolution; it needs only the
        # actions:write scope granted below.
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update-feed.yml/enable"
